# Millstone MPC skin: a semi-modular style panel. Shadow coordinates (skin y = y - 86), 1280 wide,
# controls kept left of x~1010 (MPC's Q-Link sidebar). One qlinks line per tab, most-turned first.

# Look (2026-11-12): a cream hardware panel. Art from vst/skin/make_art.py (knob filmstrip, plate with screws),
# type and frames from vst/skin/skin.css; rendered by the port kit's browser renderer ("art": "html" in vst.json).
theme_bg=e9e1cc
theme_panel=e9e1cc
theme_line=3a332a
theme_accent=3a2418
theme_accent_hi=7a2b20
theme_ink=1d1a16
theme_ink_dim=4a443b
theme_lcd=d2cfc7
theme_box=d2cfc7
theme_seg_inactive=dcd5c4
theme_seg_active=2a2520
theme_seg_active_tx=f6f2e8
theme_knob_face=131313
theme_knob_ring=000000
theme_knob_dot=f2f1ec
theme_btn_text=f6f2e8
art_css=skin/skin.css
knob_strip=skin/knob.png
toggle_img=skin/switch_off.png
toggle_img_on=skin/switch_on.png
button_img=skin/button_off.png
button_img_on=skin/button_on.png
label_scale=1.25
scale_names=1

# Program Mode Q-Links (knobs banked to the track, not the screen): one column of 4 each, top to bottom.
# Filter | amp envelope | osc 1+2 timbre/morph | LFO rate, delay mix, reverb mix, volume
qlinks_track = cutoff,reso,f_mod,drive,attack,decay,sustain,release,o1_timbre,o1_morph,o2_timbre,o2_morph,lfo_rate,fx_dl_mix,fx_rv_mix,volume

